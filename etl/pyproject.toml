[project]
name = "hydrodatalab"
version = "0.1.0"
description = "Pipeline BI pédagogique des données publiques Hydro-Québec"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pandas>=2.3,<4", "pyarrow>=21,<25", "fastapi>=0.115,<1",
  "uvicorn>=0.35,<1", "tzdata>=2025.1"
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

